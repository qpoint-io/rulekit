[package]
name = "rulekit"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Expression-based rules engine (Rust port of qpoint-io/rulekit)"
repository = "https://github.com/qpoint-io/rulekit"
include = ["src/**", "Cargo.toml"]

[dependencies]
base64 = "0.23.1"
fluent-uri = "0.4.1"
foldhash = "0.2"
ipnet = "2.12.2"
regex = "1"
regex-syntax = "0.8.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
smallvec = { version = "1", features = ["const_generics", "union"] }
