[package]
name = "rulekit"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Expression-based rules engine (Rust port of qpoint-io/rulekit)"
repository = "https://github.com/qpoint-io/rulekit"
include = ["src/**", "Cargo.toml", "README.md"]
readme = "README.md"

[dependencies]
rulekit-macros = { path = "macros", version = "0.1.0", optional = true }
base64 = "0.23.1"
fluent-uri = "0.4.1"
foldhash = "0.2"
ipnet = "2.12.2"
regex = "1"
regex-syntax = "0.8.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
smallvec = { version = "1", features = ["const_generics", "union"] }

[features]
default = ["derive"]
# `#[derive(rulekit::Args)]` for typed custom functions.
derive = ["dep:rulekit-macros"]

[workspace]
members = ["macros"]

[dev-dependencies]
criterion = "0.8.2"
trybuild = "1.0.121"

[[bench]]
name = "eval"
harness = false

[[bench]]
name = "allocs"
harness = false

[profile.bench]
lto = "fat"
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rulekit_size_probe)"] }
