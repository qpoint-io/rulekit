[package]
name = "rulekit"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Expression-based rules engine (Rust port of qpoint-io/rulekit)"
repository = "https://github.com/qpoint-io/rulekit"
include = ["src/**", "Cargo.toml"]

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
