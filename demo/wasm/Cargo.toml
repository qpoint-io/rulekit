[package]
name = "rulekit-demo-wasm"
version = "0.0.0"
edition = "2024"
publish = false
description = "Demo-local WASM bridge from the Vue demo to the Rust rulekit crate"

[lib]
crate-type = ["cdylib"]

[dependencies]
rulekit = { path = "../../rust", default-features = false }
base64 = "0.23.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned exactly: the wasm-bindgen CLI that build.sh runs must be this version.
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# Standalone: not part of the rulekit crate's workspace.
[workspace]
